// Datensicherung: Tabellen als JSON plus alle Dateien in eine ZIP-Datei (nur Superadmin).
async function sicherung(uid,label,btn){
  var r=await SW.fn('verwaltung',uid?{aktion:'sicherung',uid:uid}:{aktion:'sicherung'});
  if(!r||!r.ok)throw new Error((r&&r.error)||'Sicherung fehlgeschlagen.');
  var enc=new TextEncoder(),F=[],fehl=[],n=0;
  Object.keys(r.tabellen).forEach(function(t){n+=r.tabellen[t].length;F.push({name:'tabellen/'+t+'.json',data:enc.encode(JSON.stringify(r.tabellen[t],null,1))});});
  for(var i=0;i<r.dateien.length;i++){var d=r.dateien[i];if(btn)btn.textContent='Dateien '+(i+1)+' von '+r.dateien.length+' …';
    try{if(!d.url)throw 0;var x=await fetch(d.url);if(!x.ok)throw 0;F.push({name:'dateien/'+d.pfad,data:new Uint8Array(await x.arrayBuffer())});}catch(e){fehl.push(d.pfad);}}
  var st=new Date(r.am),z=function(v){return String(v).padStart(2,'0');},stamp=st.getFullYear()+'-'+z(st.getMonth()+1)+'-'+z(st.getDate())+'_'+z(st.getHours())+z(st.getMinutes());
  F.unshift({name:'LIESMICH.txt',data:enc.encode('SwitchWatt Datensicherung vom '+st.toLocaleString('de-DE')+'\r\nUmfang: '+(uid?'ein Kunde ('+label+')':'alle Daten')+'\r\nTabellen: '+Object.keys(r.tabellen).length+' mit '+n+' Zeilen (Ordner tabellen, JSON)\r\nDateien: '+(r.dateien.length-fehl.length)+' von '+r.dateien.length+' (Ordner dateien)'+(fehl.length?'\r\nNICHT gesichert: '+fehl.join(', '):'')+'\r\n')});
  var a=document.createElement('a');a.href=URL.createObjectURL(SWZip.zip(F));a.download='SwitchWatt-Sicherung_'+stamp+(uid?'_'+String(label||uid).replace(/[^\w.@-]+/g,'_'):'')+'.zip';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},10000);
  return {fehl:fehl,dateien:r.dateien.length,zeilen:n};
}
document.addEventListener('click',async function(e){var b=e.target.closest&&e.target.closest('[data-sich]');if(!b||b.disabled)return;e.preventDefault();

    alert('Sicherung heruntergeladen: '+s.zeilen+' Datensätze, '+(s.dateien-s.fehl.length)+' von '+s.dateien+' Dateien.'+(s.fehl.length?'\n\nAchtung, '+s.fehl.length+' Dateien fehlen (siehe LIESMICH.txt).':'')+'\n\nBitte die ZIP-Datei in OneDrive „11 SwitchWatt“ ablegen.');}

// „Was ist zu tun?“: Aufgaben ergeben sich aus dem Stand der Kunden. „Erledigt“ blendet eine Aufgabe aus, „Später“ für 7 Tage.
function aufgabenHtml(an,users,vm,WS,AE,KA){
  var heute=new Date().toISOString().slice(0,10),aus={};
  AE.forEach(function(x){if(!x.bis||x.bis>heute)aus[x.schluessel]=x;});
  var L=[],tage=function(d){return d?Math.floor((Date.now()-new Date(d).getTime())/864e5):null;};
  var cur=null,GR={frist:'w',freigabe:'w',angebote:'w',nachfassen:'w',fristfehlt:'w',startfehlt:'w',vertragfehlt:'w',daten:'k',kontakt:'k',check:'c',ws:'c'};
  var add=function(k,prio,text,link,wer,info){if(!aus[k])var g=GR[k.split(':')[0]]||'k';info=info||'';if(g==='w'&&!/kündigen bis|Frist offen|Kündigungsfrist/.test(info+text))info=(cur?'kündigen bis '+SW.date(cur):'Frist offen')+(info?' · '+info:'');L.push({k:k,p:prio,t:text,l:link,w:wer,i:info,g:g,f:cur});};
  an.forEach(function(a){var u=users[a.owner]||{};if(u.geschlossen_at)return;cur=a.kuendigung_bis||null;var wer='<a href="#/k/'+a.owner+'">'+E(u.name||u.email||'?')+'</a>',lk='<a href="#/a/'+a.id+'">'+E(a.name)+'</a>';
    var v=vm[a.owner],hatVm=v&&(!v.anlagen||!v.anlagen.length||v.anlagen.indexOf(a.id)>=0),ang=SW.arr(a.angebote),fg=SW.arr(a.freigaben),d=SW.daysUntil(a.kuendigung_bis),offen=OPEN.indexOf(a.status)>=0;
    var fristP=d==null?4:d<=14?1:d<=30?2:d<=60?3:4;
    if(hatVm&&offen&&a.kuendigung_bis&&d!=null&&d<=30&&!fg.length)add('frist:'+a.id+':'+a.kuendigung_bis,d<=14?0:1,(d<0?'Kündigungsfrist abgelaufen':'Kündigungsfrist in '+d+' Tagen')+' ('+SW.date(a.kuendigung_bis)+')',lk,wer,ang.length?ang.length+' Angebot(e), noch nicht freigegeben':'noch keine Angebote');
    if(fg.length&&['kuendigung','gewechselt'].indexOf(a.status)<0)add('freigabe:'+a.id,fristP,'Kunde hat freigegeben: Kündigung und neuen Vertrag vorbereiten',lk,wer,'freigegeben am '+SW.date(fg[0].freigegeben_at));
    if(hatVm&&offen&&!ang.length&&!fg.length)add('angebote:'+a.id,fristP,'Angebote einholen',lk,wer,'Vollmacht seit '+SW.date(v.erteilt_at)+(a.kuendigung_bis?' · kündigen bis '+SW.date(a.kuendigung_bis):' · Frist offen'));
    if(ang.length&&!fg.length&&offen){var neu=ang.map(function(o){return o.created_at;}).sort().pop(),t=tage(neu);if(t!=null&&t>=5)add('nachfassen:'+a.id+':'+String(neu).slice(0,10),fristP,'Kunde hat seit '+t+' Tagen nicht freigegeben: nachfassen',lk,wer,ang.length+' Angebot(e)');}
    if(offen&&!a.kuendigung_bis&&hatVm&&a._t){if(a._t.fehlt==='vertrag')add('vertragfehlt:'+a.id,3,'Vertrag anfordern',lk,wer,'ohne Vertrag kein Kündigungstermin');else if(a._t.fehlt==='start')add('startfehlt:'+a.id,3,'Beginn der Belieferung klären',lk,wer,'Vertrag läuft '+(a._t.laufzeit?a._t.laufzeit/12+' Jahre ':'')+'ab tatsächlichem Beginn, Datum fehlt');else add('fristfehlt:'+a.id,4,'Kündigungsfrist im Vertrag prüfen',lk,wer,'Termin ließ sich nicht berechnen');}
    if(!a.daten_bestaetigt_at&&tage(a.created_at)>=3)add('daten:'+a.id,5,'Kunde hat die Anlagendaten noch nicht bestätigt: erinnern',lk,wer,'angelegt am '+SW.date(a.created_at));

  var G=[['w','Wechselservice'],['c','Abrechnungs-Check'],['k','Kunden und Anfragen']];

}

async function renderList(){

    (e.punkte||[]).filter(function(p){return p.stufe!=='ok';}).map(function(p){return '<li><strong>'+({rot:'❗',gelb:'⚠️',info:'ℹ️'}[p.stufe]||'')+' '+E(p.titel)+':</strong> '+E(p.text)+'</li>';}).join('')+
    '<li class="sw-muted">'+(e.punkte||[]).filter(function(p){return p.stufe==='ok';}).length+' Punkte in Ordnung</li></ul></details>';}).join('')+'</section>';
  /* Dokumente */
  h+='<section class="sw-card"><h2>Dokumente</h2>'+(docs.length?'<table><tbody>'+docs.map(function(x){return '<tr><td><a href="#" data-file="'+E(x.pfad)+'">'+E(x.dateiname)+'</a></td><td>'+E(SW.ART[x.art]||x.art)+'</td><td>'+SW.date(x.created_at)+'</td><td><button class="sw-btn ghost small" data-read="'+x.id+'">auslesen</button>'+(ME.superadmin?' <button class="sw-btn ghost small" data-dokdel="'+x.id+'" style="color:#F87171" title="Nur Superadmin">Löschen</button>':'')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="sw-muted">Keine.</p>')+
  '<div class="sw-row" style="margin-top:14px"><select id="ua" style="flex:0 1 240px"><option value="kuendigung_entwurf">Kündigung (Entwurf)</option><option value="sonstiges">Sonstiges</option><option value="vertrag">Vertrag</option></select><input id="uf" type="file" style="flex:1 1 240px"><button class="sw-btn ghost" id="ub">Hochladen</button><button class="sw-btn ghost" id="kb">Kündigung erzeugen</button></div><div id="uerr"></div></section>';
  /* Verlauf */
  h+='<section class="sw-card"><h2>Verlauf</h2><div class="sw-row"><input id="vt" placeholder="Eintrag (sieht der Kunde)" style="flex:1 1 300px"><button class="sw-btn ghost" id="vb">Eintragen</button></div><table style="margin-top:12px"><tbody>'+log.map(function(l){var w=users[l.von];return '<tr><td style="width:170px" class="sw-muted">'+SW.dateTime(l.created_at)+'</td><td>'+E(l.text)+'</td><td class="sw-muted" style="font-size:13px">'+E(w?(w.rolle==='admin'?'SwitchWatt':w.name||w.email):'')+'</td></tr>';}).join('')+'</tbody></table></section>';
  app.innerHTML=h;

  function reload(){renderOne(id);}
  async function logEntry(t){await SW.rest('verlauf',{method:'POST',body:{anlage_id:a.id,text:t}});}
  var cfOn=$('#cf_on');if(cfOn)cfOn.onclick=async function(){try{await SW.rest('check_frei?on_conflict=anlage_id',{method:'POST',prefer:'resolution=merge-duplicates',body:{anlage_id:a.id,frei_at:new Date().toISOString()}});await logEntry('Abrechnungs-Check freigeschaltet');reload();}catch(x){alert(x.message);}};
  var cfOff=$('#cf_off');if(cfOff)cfOff.onclick=async function(){try{await SW.rest('check_frei?anlage_id=eq.'+a.id,{method:'PATCH',body:{frei_at:null}});reload();}catch(x){alert(x.message);}};
  $('#stb').onclick=async function(){try{var s=$('#st').value,n=$('#stn').value.trim();await SW.rest('anlagen?id=eq.'+a.id,{method:'PATCH',body:{status:s}});await logEntry('Status: '+SW.STATUS[s][0]+(n?' – '+n:''));reload();}catch(x){$('#sterr').innerHTML=msg('err',x.message);}};
  $('#df').onsubmit=async function(e){e.preventDefault();var o={};['direktvermarkter','dv_anschrift','dv_vertragsnr','entgelt','vertragsbeginn','laufzeit_monate','vertragsende','kuendigung_bis','kuendigungsfrist','verlaengerung','mastr','malo','kwp'].forEach(function(k){var v=$('#d_'+k).value.trim();o[k]=v===''?null:(k==='kwp'?Number(v):k==='laufzeit_monate'?parseInt(v,10):v);});
    try{await SW.rest('anlagen?id=eq.'+a.id,{method:'PATCH',body:o});await logEntry('Daten von SwitchWatt ergänzt');reload();}catch(x){$('#dferr').innerHTML=msg('err',x.message);}};
  var wzb=$('#wz_go');if(wzb)wzb.onclick=async function(){if(!confirm('Ist der neue Vertrag unterschrieben? Dann wird die Wechselpauschale von '+SW.num(wz.betrag_cent/100,0)+' € netto ('+SW.num(wz.betrag_cent*1.19/100,2)+' € brutto) jetzt von der Karte des Kunden abgebucht.'))return;
    wzb.disabled=true;wzb.textContent='bucht ab …';try{var rr=await SW.fn('stripe',{aktion:'wechsel_abbuchen',anlage_id:a.id});if(!rr||!rr.ok)throw new Error((rr&&rr.error)||'Abbuchung fehlgeschlagen.');await logEntry(rr.status==='bezahlt'?'Wechselpauschale abgebucht':'Wechselpauschale: Kunde muss die Zahlung bestätigen');reload();}catch(x){alert(x.message);wzb.disabled=false;wzb.textContent='Pauschale abbuchen';}};
  var of=$('#of'); if(of){
    $('#calc').onclick=function(){var ct=parseFloat($('#o_ct').value)||0,fix=parseFloat($('#o_fix').value)||0;if(!mwh){alert('kWp fehlt');return;}
      var neu=ct*mwh*10+fix*12;var t=prompt('Heutige Kosten pro Jahr in € (aus dem Vertrag):','');if(t==null)return;var alt=parseFloat(String(t).replace(',','.'));if(isNaN(alt))return;$('#o_ers').value=Math.round(alt-neu);};
    of.onsubmit=async function(e){e.preventDefault();var num=function(s){var v=$(s).value.trim();return v===''?null:Number(v);};
      if(!$('#o_anb').value.trim()){$('#oerr').innerHTML=msg('err','Anbieter fehlt.');return;}
      try{await SW.rest('angebote',{method:'POST',body:{anlage_id:a.id,anbieter:$('#o_anb').value.trim(),ct_kwh:num('#o_ct'),fix_monat:num('#o_fix'),entgelt_text:$('#o_txt').value.trim()||null,laufzeit_monate:num('#o_lz'),kuendigungsfrist:$('#o_kf').value.trim()||null,ersparnis_jahr:num('#o_ers'),gueltig_bis:$('#o_bis').value||null,hinweise:$('#o_hin').value.trim()||null,empfohlen:$('#o_emp').checked}});
        if(['neu','in_pruefung'].indexOf(a.status)>=0){await SW.rest('anlagen?id=eq.'+a.id,{method:'PATCH',body:{status:'angebote'}});}
        await logEntry('Neues Angebot: '+$('#o_anb').value.trim());reload();}catch(x){$('#oerr').innerHTML=msg('err',x.message);}};
  }
  app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=async function(){if(!confirm('Angebot löschen?'))return;try{await SW.rest('angebote?id=eq.'+b.dataset.del,{method:'DELETE'});reload();}catch(x){alert(x.message);}};});
  app.querySelectorAll('[data-file]').forEach(function(l){l.onclick=async function(e){e.preventDefault();try{window.open(await SW.fileUrl(l.dataset.file),'_blank','noopener');}catch(x){alert(x.message);}};});
  $('#ub').onclick=async function(){var f=$('#uf').files[0];if(!f){$('#uerr').innerHTML=msg('err','Datei wählen.');return;}
    try{var path=a.owner+'/'+a.id+'/'+Date.now()+'_'+SW.safeName(f.name);await SW.upload(path,f);await SW.rest('dokumente',{method:'POST',body:{anlage_id:a.id,owner:a.owner,art:$('#ua').value,pfad:path,dateiname:f.name}});await logEntry(SW.ART[$('#ua').value]+' bereitgestellt: '+f.name);reload();}catch(x){$('#uerr').innerHTML=msg('err',x.message);}};
  app.querySelectorAll('[data-read]').forEach(function(b){b.onclick=async function(){b.disabled=true;b.textContent='liest …';var r=await SW.fn('auslesen',{dokument_id:b.dataset.read});b.textContent=r.ok?'fertig':'Fehler';if(r.ok)reload();else alert(r.error||'Fehler');};});
  app.querySelectorAll('[data-dokdel]').forEach(function(b){b.onclick=async function(){var d=docs.filter(function(x){return x.id===b.dataset.dokdel;})[0];if(!d)return;
    var t=prompt('Unterlage endgültig löschen?\n\n„'+d.dateiname+'“\n\nDas kann nicht rückgängig gemacht werden. Zur Bestätigung LÖSCHEN eintippen:','');
    if(t==null)return;if(t.trim().toUpperCase()!=='LÖSCHEN'){alert('Nicht bestätigt. Es wurde nichts gelöscht.');return;}
    try{await SW.rest('dokumente?id=eq.'+d.id,{method:'DELETE'});try{await SW.removeFile(d.pfad);}catch(e){}await logEntry('Unterlage gelöscht: '+d.dateiname);reload();}catch(x){alert(x.message);}};});
  $('#kb').onclick=function(){try{SW.kuendigung(a,u.firma);}catch(x){alert(x.message);}};
  $('#vb').onclick=async function(){var t=$('#vt').value.trim();if(!t)return;try{await logEntry(t);reload();}catch(x){alert(x.message);}};

async function renderKunde(uid){
  var q=encodeURIComponent(uid);
  var r=await Promise.all([SW.rest('profiles?select=*&id=eq.'+q),SW.rest('anlagen?select=*,dokumente(id),angebote(id),check_frei(frei_at)&owner=eq.'+q+'&order=created_at.asc'),SW.rest('abos?select=*,anlagen(name)&owner=eq.'+q+'&order=created_at.desc'),SW.rest('vollmachten?select=*&owner=eq.'+q+'&order=erteilt_at.desc')]);
  var p=r[0][0];if(!p){app.innerHTML=msg('err','Kunde nicht gefunden.');return;}
  var an=r[1],ab=r[2],vms=r[3],SA=!!ME.superadmin,g=!!p.geschlossen_at;
  var adr=[p.strasse,[p.plz,p.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  var h='<p style="margin-top:28px"><a href="#/">← Übersicht</a></p><div class="sw-row" style="justify-content:space-between;align-items:flex-start"><div><h1 style="margin-bottom:4px">'+E(p.name||p.email)+'</h1>'+(p.firma?'<p class="sw-muted" style="margin:0">'+E(p.firma)+'</p>':'')+'</div>'+(g?'<span class="sw-badge" style="--c:#71717A">geschlossen am '+SW.date(p.geschlossen_at)+'</span>':'')+'</div>';
  h+='<section class="sw-card"><h2>Kontakt</h2><dl class="sw-grid sw-dl">'+[['E-Mail','<a href="mailto:'+E(p.email)+'">'+E(p.email)+'</a>'],['Telefon',E(p.telefon||'–')],['Anrede',E(p.anrede||'–')],['Anschrift',E(adr||'–')],['USt-IdNr.',E(p.ust_id||'–')],['Interesse',E({wechsel:'Direktvermarkter-Wechsel',check:'Abrechnungs-Check',beide:'beides'}[p.bereich]||'–')],['Konto seit',SW.date(p.created_at)]].map(function(f){return '<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>';}).join('')+'</dl></section>';
  h+='<section class="sw-card"><h2>Anlagen</h2>'+(an.length?'<table class="sw-stack"><thead><tr><th>Anlage</th><th>kWp</th><th>Status</th><th>Kündigen bis</th><th>Stand</th></tr></thead><tbody>'+an.map(function(a){var cf=SW.arr(a.check_frei)[0];return '<tr><td data-l="Anlage"><a href="#/a/'+a.id+'">'+E(a.name)+'</a></td><td data-l="kWp">'+SW.num(a.kwp,1)+'</td><td data-l="Status">'+SW.badge(a.status)+'</td><td data-l="Kündigen bis">'+SW.date(a.kuendigung_bis)+'</td><td data-l="Stand" style="font-size:14px">'+SW.arr(a.dokumente).length+' Dokument(e) · '+SW.arr(a.angebote).length+' Angebot(e)'+(cf&&cf.frei_at?' · Check frei':'')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="sw-muted">Noch keine Anlage.</p>')+'</section>';
  h+='<section class="sw-card"><h2>Abos</h2>'+(ab.length?'<table class="sw-stack"><thead><tr><th>Anlage</th><th>Paket</th><th>Preis</th><th>Status</th><th>Laufzeit</th></tr></thead><tbody>'+ab.map(function(x){var aktiv=['active','trialing','past_due'].indexOf(x.status)>=0;return '<tr><td data-l="Anlage">'+E((x.anlagen&&x.anlagen.name)||'–')+'</td><td data-l="Paket">Check '+E(String(x.klasse||'').toUpperCase())+' · '+(x.intervall==='year'?'jährlich':'monatlich')+(x.livemode===false?' <span class="sw-muted">Test</span>':'')+'</td><td data-l="Preis">'+SW.num(aboPreis(x),2)+' € netto'+(x.rabatt?' <span class="sw-muted">(−10 %)</span>':'')+'</td><td data-l="Status">'+(aktiv?(x.kuendigung_zum?'<span class="sw-badge" style="--c:#F5B70A">gekündigt</span>':'<span class="sw-badge" style="--c:#22C55E">aktiv</span>'):'<span class="sw-badge" style="--c:#71717A">beendet</span>')+(x.status==='past_due'?' <span class="sw-red">Zahlung überfällig</span>':'')+'</td><td data-l="Laufzeit" style="font-size:14px">seit '+SW.date(x.created_at)+'<br>'+(x.kuendigung_zum?'endet '+SW.date(x.kuendigung_zum):(aktiv?'verlängert sich am '+SW.date(x.laeuft_bis):'beendet'))+'</td></tr>';}).join('')+'</tbody></table>':'<p class="sw-muted">Kein Abo.</p>')+'</section>';
  h+='<section class="sw-card"><h2>Zahlungen</h2><div id="zlist"><p class="sw-muted">Wird aus Stripe geladen …</p></div></section>';
  h+='<section class="sw-card"><h2>Vollmachten</h2>'+(vms.length?'<table class="sw-stack"><tbody>'+vms.map(function(v){return '<tr><td data-l="Erteilt">'+SW.dateTime(v.erteilt_at)+'</td><td data-l="Von">'+E(v.name_unterzeichner)+(v.firma?' für '+E(v.firma):'')+'</td><td data-l="Fassung" class="sw-muted" style="font-size:13px">Fassung '+E(v.version)+(v.agb_version?' · AGB '+E(v.agb_version):'')+'</td><td data-l="Status">'+(v.widerrufen_at?'<span class="sw-badge" style="--c:#71717A">widerrufen '+SW.date(v.widerrufen_at)+'</span>':'<span class="sw-badge" style="--c:#22C55E">gültig</span>')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="sw-muted">Keine Vollmacht.</p>')+'</section>';
  if(SA&&!g&&p.rolle!=='admin')h+='<section class="sw-card"><h2>Konto</h2><p class="sw-muted" style="font-size:14px">Nur für die Superadmin sichtbar.</p><div class="sw-row"><button class="sw-btn ghost small" data-sich="'+p.id+'" data-sichn="'+E(p.email)+'">Daten dieses Kunden sichern</button><button class="sw-btn ghost small" id="k_adm">Zum Admin machen</button><button class="sw-btn ghost small" id="k_zu" style="color:#F87171">Konto schließen (Unterlagen bleiben)</button><button class="sw-btn ghost small" id="k_weg" style="color:#F87171">Konto komplett löschen (mit Unterlagen)</button></div><p class="sw-muted" style="font-size:13px;margin:10px 0 0">Schließen: Login gesperrt, Abos gekündigt, alles bleibt archiviert. Komplett löschen: Vorher wird automatisch eine ZIP-Sicherung dieses Kunden heruntergeladen, danach sind alle Anlagen, Unterlagen und Dateien weg.</p><div id="kerr"></div></section>';
  app.innerHTML=h;
  SW.fn('verwaltung',{aktion:'zahlungen',uid:uid}).then(function(z){var L=((z&&z.zahlungen)||[]).sort(function(a,b){return a.datum<b.datum?1:-1;});var el=document.getElementById('zlist');if(!el)return;
    el.innerHTML=L.length?'<table class="sw-stack"><thead><tr><th>Datum</th><th>Rechnung</th><th>Leistung</th><th>Betrag</th><th>Status</th><th></th></tr></thead><tbody>'+L.map(function(x){var st=ZST[x.status]||[x.status,'#71717A'];return '<tr><td data-l="Datum">'+SW.date(x.datum)+'</td><td data-l="Rechnung">'+E(x.nummer||'–')+'</td><td data-l="Leistung" style="font-size:14px">'+E(x.text)+'</td><td data-l="Betrag">'+SW.num(x.betrag,2)+' € brutto</td><td data-l="Status"><span class="sw-badge" style="--c:'+st[1]+'">'+st[0]+'</span>'+(x.test?' <span class="sw-muted">Test</span>':'')+'</td><td>'+(x.pdf?'<a href="'+E(x.pdf)+'" target="_blank" rel="noopener">PDF</a>':'')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="sw-muted">Noch keine Zahlungen.</p>';
  }).catch(function(){var el=document.getElementById('zlist');if(el)el.innerHTML=msg('err','Zahlungen konnten nicht geladen werden.');});
  var kw=$('#k_weg');if(kw)kw.onclick=async function(){
    var t=prompt('Konto von '+(p.name||p.email)+' KOMPLETT löschen?\n\nDas löscht unwiderruflich alle Anlagen, Unterlagen, Dateien, Prüfungen und den Verlauf. Laufende Abos werden sofort gekündigt.\n\nZur Bestätigung die E-Mail-Adresse eintippen:','');
    if(t==null)return;if(t.trim().toLowerCase()!==String(p.email||'').toLowerCase()){alert('Die E-Mail-Adresse stimmt nicht. Es wurde nichts gelöscht.');return;}
    kw.disabled=true;kw.textContent='Sicherung läuft …';
    try{var sb=await sicherung(p.id,p.email,kw);if(sb.fehl.length)throw new Error('Die Sicherung ist unvollständig ('+sb.fehl.length+' Dateien fehlen). Es wurde nichts gelöscht.');
      if(!confirm('Die Sicherung wurde heruntergeladen. Bitte erst prüfen, dass die ZIP-Datei angekommen ist (Downloads), und sie in OneDrive ablegen.\n\nJetzt endgültig löschen?')){kw.disabled=false;kw.textContent='Konto komplett löschen (mit Unterlagen)';return;}
      kw.textContent='wird gelöscht …';var ds=await SW.rest('dokumente?select=id,pfad&owner=eq.'+p.id);for(var i=0;i<ds.length;i++){try{await SW.removeFile(ds[i].pfad);}catch(e){}}
      if(ds.length)await SW.rest('dokumente?owner=eq.'+p.id,{method:'DELETE'});
      var res=await SW.fn('verwaltung',{aktion:'konto_schliessen',uid:p.id,email:t.trim()});
      if(!res.ok)throw new Error(res.error||'Fehler');
      alert(res.art==='entfernt'?'Das Konto ist komplett gelöscht.':'Achtung: Es waren noch Unterlagen da, das Konto wurde nur geschlossen.');location.hash='#/';}
    catch(x){alert(x.message);kw.disabled=false;kw.textContent='Konto komplett löschen (mit Unterlagen)';}};
  var ka=$('#k_adm');if(ka)ka.onclick=async function(){if(!confirm((p.name||p.email)+' zum Admin machen? Die Person sieht dann alle Kunden, Anlagen und Unterlagen.'))return;try{await SW.rest('rpc/admin_setzen',{method:'POST',body:{uid:p.id,an:true}});location.hash='#/';}catch(x){$('#kerr').innerHTML=msg('err',x.message);}};
  var kz=$('#k_zu');if(kz)kz.onclick=async function(){
    var t=prompt('Konto von '+(p.name||p.email)+' schließen?\n\nLaufende Abos werden sofort gekündigt, die Anmeldung gesperrt und die Vollmacht widerrufen. Unterlagen werden nie gelöscht: Hat das Konto Unterlagen, bleibt alles archiviert sichtbar. Ohne Unterlagen wird das Konto ganz entfernt. Die E-Mail-Adresse ist danach wieder frei.\n\nZur Bestätigung die E-Mail-Adresse eintippen:','');
    if(t==null)return;if(t.trim().toLowerCase()!==String(p.email||'').toLowerCase()){alert('Die E-Mail-Adresse stimmt nicht. Es wurde nichts geändert.');return;}
    kz.disabled=true;kz.textContent='wird geschlossen …';var res=await SW.fn('verwaltung',{aktion:'konto_schliessen',uid:p.id,email:t.trim()});

    alert(res.art==='entfernt'?'Das Konto hatte keine Unterlagen und wurde ganz entfernt.':'Das Konto ist geschlossen. Die Unterlagen bleiben archiviert.');location.hash='#/';};

async function route(){var h=location.hash||'#/';try{if(h.indexOf('#/a/')===0)await renderOne(h.slice(4));else if(h.indexOf('#/k/')===0)await renderKunde(h.slice(4));else await renderList();}catch(x){app.innerHTML=msg('err',x.message);}window.scrollTo(0,0);}
async function start(){
  me=await SW.me();if(!me){renderLogin();return;}
  var p=(await SW.rest('profiles?select=*&id=eq.'+me.id))[0];
  ME=p||{};
  if(!p||p.rolle!=='admin'){app.innerHTML=msg('err','Dieses Konto hat keinen Zugang zur Verwaltung.')+'<p><a href="portal.html">Zum Kundenkonto</a></p>';return;}
  nav.innerHTML='<a class="sw-btn ghost small" href="#/">Übersicht</a><a class="sw-btn ghost small" href="index.html" target="_blank" rel="noopener">Website ↗</a><button class="sw-btn ghost small" id="out">Abmelden</button>';
  document.getElementById('out').onclick=async function(){await SW.signOut();renderLogin();};
  route();
}
window.addEventListener('hashchange',function(){if(me)route();});
(async function(){if(!SW.user){renderLogin();return;}try{await start();}catch(e){renderLogin();}})();
})();
</script>
