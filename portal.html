<script>
(function(){
var app=document.getElementById('app'),nav=document.getElementById('topnav'),modal=document.getElementById('modal');
var E=SW.esc, me=null, profile=null;
function msg(type,text){return '<div class="sw-msg '+type+'" role="'+(type==='err'?'alert':'status')+'">'+E(text)+'</div>';}
function $(s){return app.querySelector(s);}
function busy(btn,on,label){if(!btn)return;btn.disabled=on;if(on){btn.dataset.l=btn.textContent;btn.textContent=label||'Bitte warten …';}else if(btn.dataset.l){btn.textContent=btn.dataset.l;}}
function go(h){if(location.hash===h)route();else location.hash=h;}

/* ---------- Anmeldung ---------- */
function renderAuth(mode,note){
  nav.innerHTML='';
  mode=mode||'login';
  app.innerHTML='<div style="max-width:460px;margin:0 auto"><h1>Ihr Switchwatt-Konto</h1>'+
  '<p class="sw-muted">Hier laden Sie Ihre Verträge hoch, sehen die Angebote und geben den Wechsel frei.</p>'+
  (note||'')+
  (mode==='signup'&&!note?'<div class="sw-msg info" style="font-size:14px"><strong>Exklusive Pilotphase.</strong> Wir nehmen nur eine begrenzte Zahl an Anlagen auf, mit Vorrang nach Kündigungstermin, und melden uns nach Ihrer Anmeldung persönlich. Die Vollmacht erlaubt uns nur, Angebote einzuholen. Gekündigt und gewechselt wird erst, wenn Sie ein Angebot freigeben.</div>':'')+
  '<div class="sw-card"><div class="sw-tabs" role="tablist"><button role="tab" data-m="login" aria-selected="'+(mode==='login')+'">Anmelden</button><button role="tab" data-m="signup" aria-selected="'+(mode==='signup')+'">Konto anlegen</button></div>'+
  '<form id="f" novalidate>'+
  (mode==='signup'?'<div style="margin-bottom:14px"><label for="name">Ihr Name</label><input id="name" required autocomplete="name"></div><div style="margin-bottom:14px"><label for="firma">Firma (optional)</label><input id="firma" autocomplete="organization"></div><div style="margin-bottom:14px"><label for="tel">Telefon (optional)</label><input id="tel" type="tel" autocomplete="tel"></div>':'')+
  '<div style="margin-bottom:14px"><label for="mail">E-Mail</label><input id="mail" type="email" required autocomplete="email"></div>'+
  '<div style="margin-bottom:14px"><label for="pw">Passwort'+(mode==='signup'?' (mindestens 8 Zeichen)':'')+'</label><input id="pw" type="password" required minlength="8" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'"></div>'+
  (mode==='signup'?'<label class="sw-check" style="margin-bottom:16px"><input type="checkbox" id="ds" required><span>Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen.</span></label>':'')+
  '<div id="err"></div><button class="sw-btn" style="width:100%" type="submit">'+(mode==='signup'?'Konto anlegen':'Anmelden')+'</button></form>'+
  (mode==='login'?'<p style="margin:16px 0 0;font-size:14px"><a href="#" id="forgot">Passwort vergessen?</a></p>':'')+
  '</div></div>';
  app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){renderAuth(b.dataset.m);};});
  var fg=$('#forgot'); if(fg)fg.onclick=function(e){e.preventDefault();renderForgot();};
  $('#f').onsubmit=async function(e){e.preventDefault();var btn=this.querySelector('button[type=submit]'),err=$('#err');err.innerHTML='';
    var mail=$('#mail').value.trim(),pw=$('#pw').value;
    if(!mail||pw.length<8){err.innerHTML=msg('err','Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.');return;}
    busy(btn,true);
    try{
      if(mode==='signup'){
        if(!$('#name').value.trim()){throw new Error('Bitte geben Sie Ihren Namen ein.');}
        if(!$('#ds').checked){throw new Error('Bitte bestätigen Sie die Datenschutzerklärung.');}
        var d=await SW.signUp(mail,pw,{name:$('#name').value.trim(),firma:$('#firma').value.trim(),telefon:$('#tel').value.trim()});
        if(!d||!d.access_token){renderAuth('login',msg('info','Fast geschafft: Bitte bestätigen Sie Ihre E-Mail-Adresse über den Link, den wir Ihnen geschickt haben. Danach können Sie sich anmelden.'));return;}
      } else { await SW.signIn(mail,pw); }
      await start();
    }catch(x){err.innerHTML=msg('err',x.message);busy(btn,false);}
  };
}
function renderForgot(){
  app.innerHTML='<div style="max-width:460px;margin:0 auto"><h1>Passwort zurücksetzen</h1><div class="sw-card"><form id="f"><label for="mail">E-Mail</label><input id="mail" type="email" required autocomplete="email"><div id="err"></div><div class="sw-row" style="margin-top:16px"><button class="sw-btn" type="submit">Link senden</button><button class="sw-btn ghost" type="button" id="back">Zurück</button></div></form></div></div>';
  $('#back').onclick=function(){renderAuth();};
  $('#f').onsubmit=async function(e){e.preventDefault();var btn=this.querySelector('[type=submit]');busy(btn,true);
    try{await SW.recover($('#mail').value.trim(),location.origin+location.pathname);$('#err').innerHTML=msg('ok','Wenn es ein Konto mit dieser E-Mail gibt, ist ein Link unterwegs.');}
    catch(x){$('#err').innerHTML=msg('err',x.message);} busy(btn,false);};
}
function renderNewPassword(){
  app.innerHTML='<div style="max-width:460px;margin:0 auto"><h1>Neues Passwort</h1><div class="sw-card"><form id="f"><label for="pw">Neues Passwort (mindestens 8 Zeichen)</label><input id="pw" type="password" minlength="8" required autocomplete="new-password"><div id="err"></div><button class="sw-btn" style="margin-top:16px" type="submit">Speichern</button></form></div></div>';
  $('#f').onsubmit=async function(e){e.preventDefault();var pw=$('#pw').value;if(pw.length<8){$('#err').innerHTML=msg('err','Mindestens 8 Zeichen.');return;}
    try{await SW.setPassword(pw);await start();}catch(x){$('#err').innerHTML=msg('err',x.message);}};
}

/* ---------- Daten ---------- */
async function loadAll(){
  var r=await Promise.all([
    SW.rest('vollmachten?select=*&widerrufen_at=is.null&order=erteilt_at.desc'),
    SW.rest('anlagen?select=*,angebote(id),freigaben(id),pruefungen(monat,status)&order=created_at.asc')
  ]);
  return {vm:r[0][0]||null,anlagen:r[1]};
}
function steps(vm,anlagen){
  var s=['Konto','Anlage und Vertrag','Vollmacht','Angebote','Freigabe','Kündigung und Wechsel'];
  var best=1; if(anlagen.length)best=2;
  if(vm&&anlagen.length)best=3;
  anlagen.forEach(function(a){var lv={neu:3,in_pruefung:3,angebote:4,freigegeben:5,kuendigung:5,gewechselt:6}[a.status]||3;if(vm&&lv>best)best=lv;});
  return '<ol class="sw-steps">'+s.map(function(t,i){return '<li class="'+(i<best?'done':i===best?'now':'')+'">'+t+'</li>';}).join('')+'</ol>';
}

/* ---------- Übersicht ---------- */
async function renderHome(){
  var d=await loadAll(),vm=d.vm,an=d.anlagen;
  var h='<h1>Guten Tag'+(profile&&profile.name?', '+E(profile.name):'')+'</h1><p class="sw-muted">So weit sind Sie:</p>'+steps(vm,an);
  h+='<section class="sw-card'+(an.length?'':' hl')+'"><div class="sw-row" style="justify-content:space-between"><h2 style="margin:0">'+(an.length?'Ihre Anlagen':'1. Anlage hinzufügen')+'</h2><a class="sw-btn" href="#/neu">+ Anlage hinzufügen</a></div>';
  if(!an.length)h+='<p class="sw-muted" style="margin-bottom:0">Laden Sie Ihren aktuellen Vertrag oder die letzte Gutschrift hoch, ein Handyfoto reicht. Wir lesen die Daten für Sie aus.</p>';
  an.forEach(function(a){var dd=SW.daysUntil(a.kuendigung_bis);
    h+='<div class="sw-list-item"><div><strong>'+E(a.name)+'</strong> '+SW.badge(a.status)+(!a.daten_bestaetigt_at&&['neu','in_pruefung'].indexOf(a.status)>=0?' <span class="sw-badge" style="--c:#F5B70A">Daten prüfen</span>':'')+'<div class="sw-muted" style="font-size:14px">'+(a.kwp?SW.num(a.kwp,1)+' kWp · ':'')+E(a.direktvermarkter||'Direktvermarkter noch offen')+
    (a.kuendigung_bis?' · Kündigen bis '+SW.date(a.kuendigung_bis)+(dd!=null&&dd<=30&&dd>=0&&['neu','in_pruefung','angebote','freigegeben'].indexOf(a.status)>=0?' <span class="sw-red">(noch '+dd+' Tage)</span>':''):'')+
    (function(){var pc=SW.arr(a.pruefungen).sort(function(x,y){return x.monat<y.monat?1:-1;})[0];return pc?' · Abrechnung '+monatName(pc.monat)+' '+(CK[pc.status]||CK.fehler)[0]:'';})()+(SW.arr(a.angebote).length&&!SW.arr(a.freigaben).length?' · <span style="color:#86EFAC">'+SW.arr(a.angebote).length+' Angebot(e)</span>':'')+'</div></div><a class="sw-btn ghost small" href="#/anlage/'+a.id+'">Öffnen</a></div>';});
  h+='</section>';
  if(!vm&&an.length){
    h+='<section class="sw-card hl"><h2>2. Vollmacht erteilen</h2>'+
    '<ul class="sw-vmkurz"><li><strong>Sie erlauben uns:</strong> Angebote bei Direktvermarktern einzuholen und dafür Ihre Anlagendaten weiterzugeben, und die Einspeisedaten beim Netzbetreiber anzufordern.</li><li><strong>Erst wenn Sie ein Angebot freigeben,</strong> kündigen wir den alten Vertrag und schließen den neuen ab. Vorher nicht.</li><li><strong>Widerruf</strong> jederzeit per E-Mail an angebote@switchwatt.de.</li></ul>'+
    '<details class="sw-vmdet"><summary>Vollständigen Text der Vollmacht lesen</summary><div class="sw-vm">'+SW.VOLLMACHT_HTML+'</div></details>'+
    '<form id="vmf" style="margin-top:16px"><div class="sw-grid"><div><label for="vmn">Ihr Name</label><input id="vmn" required value="'+E(profile&&profile.name||'')+'"></div><div><label for="vmfi">Für die Firma (Betreiber)</label><input id="vmfi" value="'+E(profile&&profile.firma||'')+'"></div></div>'+
    '<label class="sw-check" style="margin:16px 0"><input type="checkbox" id="vmc"><span>Ich erteile die Vollmacht wie oben beschrieben und bin berechtigt, für den Betreiber zu handeln.</span></label><div id="vmerr"></div><button class="sw-btn" type="submit">Vollmacht erteilen</button></form></section>';
  } else if(vm){
    h+='<p class="sw-msg ok">Vollmacht erteilt am '+SW.dateTime(vm.erteilt_at)+' von '+E(vm.name_unterzeichner)+(vm.firma?' für '+E(vm.firma):'')+'. <a href="#" id="vmshow">Text ansehen</a></p>';
  }
  h+='<p class="sw-muted" style="font-size:14px">Fragen? Schreiben Sie uns: <a href="mailto:angebote@switchwatt.de">angebote@switchwatt.de</a></p>';
  app.innerHTML=h;
  var vs=$('#vmshow'); if(vs)vs.onclick=function(e){e.preventDefault();showModal('<h2>Ihre Vollmacht</h2><div class="sw-vm">'+SW.VOLLMACHT_HTML+'</div><p class="sw-muted" style="font-size:14px">Fassung '+E(vm.version)+'. Widerruf jederzeit per E-Mail an angebote@switchwatt.de.</p><button class="sw-btn" data-close>Schließen</button>');};
  var f=$('#vmf'); if(f)f.onsubmit=async function(e){e.preventDefault();var btn=f.querySelector('[type=submit]'),n=$('#vmn').value.trim();
    if(!n||!$('#vmc').checked){$('#vmerr').innerHTML=msg('err','Bitte Namen eingeben und das Kästchen ankreuzen.');return;}
    busy(btn,true);
    try{await SW.rest('vollmachten',{method:'POST',body:{version:SW.VOLLMACHT_VERSION,name_unterzeichner:n,firma:$('#vmfi').value.trim()||null}});renderHome();}
    catch(x){$('#vmerr').innerHTML=msg('err',x.message);busy(btn,false);}};
}

/* ---------- Anlage anlegen / bearbeiten ---------- */
var FIELDS=[
 ['name','Name der Anlage','text','z. B. Kahl am Main',true],
 ['betreiber','Betreiber (Firma wie im Vertrag)','text','z. B. Solar K & H eGbR'],
 ['betreiber_anschrift','Anschrift des Betreibers','text','Straße, PLZ Ort'],
 ['standort','Standort der Anlage','text','Straße, PLZ Ort'],
 ['kwp','Leistung in kWp','number',''],
 ['mastr','MaStR-Nummer der Einheit','text','SEE…',false,'Beginnt mit SEE. Wenn Sie sie nicht kennen: unten auf „Im Register nachsehen“ klicken.'],
 ['malo','Marktlokations-ID','text','11-stellig',false,'11 Ziffern, steht auf Ihrer Gutschrift oder der Abrechnung des Netzbetreibers.'],
 ['netzbetreiber','Netzbetreiber','text',''],
 ['direktvermarkter','Aktueller Direktvermarkter','text',''],
 ['dv_anschrift','Anschrift des Direktvermarkters','text','für das Kündigungsschreiben'],
 ['dv_vertragsnr','Vertrags- oder Kundennummer','text',''],
 ['entgelt','Aktuelles Entgelt laut Vertrag','text','z. B. 49 € pro Monat + 0,29 ct/kWh'],
 ['vertragsende','Vertrag läuft bis','date',''],
 ['kuendigungsfrist','Kündigungsfrist','text','z. B. 3 Monate zum Laufzeitende',false,'Steht im Vertrag. Wenn Sie unsicher sind, lassen Sie das Feld leer, wir prüfen es.'],
 ['kuendigung_bis','Spätester Kündigungstermin','date','',false,'Bis zu diesem Tag muss die Kündigung beim Direktvermarkter sein. Leer lassen, wenn unbekannt.'],
 ['verlaengerung','Verlängerung ohne Kündigung','text','z. B. um 12 Monate',false,'Was passiert, wenn niemand kündigt.'],
 ['notiz','Hinweise für uns','textarea','']
];
var REGMAP={kwp:'kwp',mastr:'mastr',standort:'standort',betreiber:'betreiber',netzbetreiber:'netzbetreiber'};
function formFields(a,badges){a=a||{};badges=badges||{};return '<div class="sw-grid">'+FIELDS.map(function(f){var v=a[f[0]]==null?'':a[f[0]];
  var inp=f[2]==='textarea'?'<textarea id="f_'+f[0]+'" placeholder="'+E(f[3])+'">'+E(v)+'</textarea>':'<input id="f_'+f[0]+'" type="'+f[2]+'"'+(f[2]==='number'?' step="0.01" min="0"':'')+' placeholder="'+E(f[3])+'" value="'+E(v)+'"'+(f[4]?' required':'')+'>';
  var b=badges[f[0]]||'';
  return '<div'+(f[2]==='textarea'?' style="grid-column:1/-1"':'')+' class="sw-field'+(b.indexOf('sw-warn')>=0?' warn':'')+'"><label for="f_'+f[0]+'">'+E(f[1])+(f[4]?' *':'')+'</label>'+inp+b+(f[5]?'<div class="sw-hint">'+E(f[5])+'</div>':'')+'</div>';}).join('')+'</div>';}
function readFields(){var o={};FIELDS.forEach(function(f){var v=$('#f_'+f[0]).value.trim();o[f[0]]=v===''?null:(f[2]==='number'?Number(v.replace(',','.')):v);});return o;}
async function uploadFiles(anlage,input,art){
  var files=input?Array.prototype.slice.call(input.files):[],ids=[];
  for(var i=0;i<files.length;i++){var f=files[i];if(f.size>20971520)throw new Error(f.name+' ist größer als 20 MB.');
    var path=anlage.owner+'/'+anlage.id+'/'+Date.now()+'_'+SW.safeName(f.name);
    await SW.upload(path,f);
    var d=await SW.rest('dokumente',{method:'POST',body:{anlage_id:anlage.id,owner:anlage.owner,art:art,pfad:path,dateiname:f.name},prefer:'return=representation'});
    ids.push(d[0].id);
    await SW.rest('verlauf',{method:'POST',body:{anlage_id:anlage.id,text:SW.ART[art]+' hochgeladen: '+f.name}});
  }
  return ids;
}
function renderNew(){
  app.innerHTML='<p style="margin-top:28px"><a href="#/">← Zur Übersicht</a></p><h1>Anlage hinzufügen</h1>'+
  '<p class="sw-muted">Laden Sie Ihren aktuellen Vertrag oder die letzte Abrechnung hoch. Wir lesen die Daten für Sie aus und gleichen sie mit dem Marktstammdatenregister ab. Sie prüfen danach nur noch.</p>'+
  '<section class="sw-card hl"><label class="sw-drop" for="up_doc"><strong>Vertrag oder Abrechnung auswählen</strong><span class="sw-muted">PDF oder Foto vom Handy, höchstens 20 MB</span><span id="fname" style="color:#C9D4FF"></span></label>'+
  '<input id="up_doc" type="file" accept="application/pdf,image/jpeg,image/png" multiple hidden>'+
  '<div class="sw-row" style="margin-top:14px"><label for="up_art" style="margin:0">Das ist</label><select id="up_art" style="flex:0 1 220px"><option value="vertrag">der Vertrag</option><option value="abrechnung">eine Abrechnung</option></select></div>'+
  '<div id="err"></div><div class="sw-row" style="margin-top:16px"><button class="sw-btn" id="go">Hochladen und auslesen</button><button class="sw-btn ghost" id="manual">Ohne Dokument selbst ausfüllen</button></div>'+
  '<p class="sw-muted" style="font-size:13px;margin-bottom:0">Ihre Dateien liegen verschlüsselt auf Servern in Frankfurt und sind nur für Sie und Switchwatt sichtbar. Zum Auslesen wird das Dokument kurz an unseren KI-Dienstleister übermittelt, siehe <a href="datenschutz.html" target="_blank">Datenschutz</a>.</p></section>';
  $('#up_doc').onchange=function(){var n=Array.prototype.map.call(this.files,function(f){return f.name;}).join(', ');$('#fname').textContent=n?'Ausgewählt: '+n:'';};
  async function create(){return (await SW.rest('anlagen',{method:'POST',body:{name:'Neue Anlage'},prefer:'return=representation'}))[0];}
  $('#manual').onclick=async function(){busy(this,true);try{var a=await create();go('#/anlage/'+a.id);}catch(x){$('#err').innerHTML=msg('err',x.message);busy(this,false);}};
  $('#go').onclick=async function(){var btn=this;if(!$('#up_doc').files.length){$('#err').innerHTML=msg('err','Bitte zuerst ein Dokument auswählen, oder ohne Dokument weiter.');return;}
    busy(btn,true,'Wird hochgeladen …');$('#manual').disabled=true;
    try{var a=await create();var ids=await uploadFiles(a,$('#up_doc'),$('#up_art').value);
      btn.textContent='Wir lesen Ihr Dokument aus … (bis zu 30 Sekunden)';
      $('#err').innerHTML=msg('info','Einen Moment bitte. Wir lesen das Dokument aus und gleichen es mit dem Marktstammdatenregister ab.');
      try{await SW.fn('auslesen',{dokument_id:ids[0]});}catch(e){}
      go('#/anlage/'+a.id);
    }catch(x){$('#err').innerHTML=msg('err',x.message);busy(btn,false);$('#manual').disabled=false;}};
}

/* ---------- Daten prüfen (nach dem Auslesen) ---------- */
function norm(s){return String(s==null?'':s).toLowerCase().replace(/ß/g,'ss').replace(/straße|strasse|str\./g,'str').replace(/[^a-z0-9äöü]/g,'');}
function same(k,a,b){if(a==null||a===''||b==null||b==='')return null;
  if(k==='kwp')return Math.abs(Number(a)-Number(b))<=Math.max(0.5,Number(b)*0.01);
  if(k==='standort'){var pa=(String(a).match(/\b\d{5}\b/)||[])[0],pb=(String(b).match(/\b\d{5}\b/)||[])[0];if(pa&&pb&&pa!==pb)return false;var sa=norm(String(a).split(',')[0]).replace(/\d+[a-z]?$/,''),sb=norm(String(b).split(',')[0]).replace(/\d+[a-z]?$/,'');return !sa||!sb||sa.indexOf(sb)>=0||sb.indexOf(sa)>=0;}
  var x=norm(a),y=norm(b);return x===y||x.indexOf(y)>=0||y.indexOf(x)>=0;}
function mountReview(a,box){
  var aus=a.auslesung&&a.auslesung.felder||{},reg=a.register&&a.register.einheiten||[],pick=a._pick!=null?reg[a._pick]:(reg.length===1?reg[0]:null);
  var vals={};FIELDS.forEach(function(f){var k=f[0];vals[k]=a[k];if((vals[k]==null||vals[k]==='')&&aus[k]&&aus[k].wert!=null)vals[k]=aus[k].wert;});
  if(vals.name==='Neue Anlage'||!vals.name||vals.name===a._autoName){vals.name=((String(vals.standort||'').match(/\d{5}\s+([^,]+)/)||[])[1]||'').trim()||(pick&&pick.name)||'';a._autoName=vals.name;}
  var badges={};
  FIELDS.forEach(function(f){var k=f[0],src=aus[k],rk=REGMAP[k],rv=pick&&rk?pick[rk]:null;
    if(rv!=null&&(vals[k]==null||vals[k]==='')){vals[k]=rv;badges[k]='<span class="sw-src ok">aus dem Marktstammdatenregister</span>';return;}
    var s=rk&&pick?same(k,vals[k],rv):null;
    if(s===true){badges[k]='<span class="sw-src ok">stimmt mit dem Register überein</span>';return;}
    if(s===false){badges[k]='<span class="sw-src sw-warn">Register sagt: '+E(k==='kwp'?SW.num(rv,2)+' kWp':rv)+' <button type="button" class="sw-take" data-k="'+k+'" data-v="'+E(rv)+'">übernehmen</button></span>';return;}
    if(src&&src.wert!=null){badges[k]=src.sicher===false?'<span class="sw-src sw-warn">bitte prüfen, im Dokument nicht eindeutig</span>':'<span class="sw-src doc">aus Ihrem Dokument</span>';}
  });

/* ---------- Abrechnungs-Check ---------- */
var CK={gruen:['✅','Alles in Ordnung','#22C55E'],gelb:['⚠️','Bitte ansehen','#F5B70A'],rot:['❗','Fehler gefunden','#F04438'],fehler:['❗','Prüfung fehlgeschlagen','#F04438']};
var STUFE={rot:['❗',0],gelb:['⚠️',1],info:['ℹ️',2],ok:['✓',3]};
var MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function monatName(m){m=String(m).slice(0,7);return MONATE[Number(m.slice(5,7))-1]+' '+m.slice(0,4);}
function vormonat(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function checkBody(e){
  if(!e)return '';
  var k=e.kennzahlen||{},h='';
  if(k.menge_kwh)h+='<dl class="sw-grid sw-dl sw-ck-k"><div><dt>Einspeisung</dt><dd>'+SW.num(k.menge_kwh)+' kWh'+(k.kwh_je_kwp?' ('+SW.num(k.kwh_je_kwp,1)+' kWh/kWp)':'')+'</dd></div><div><dt>Marktwert + Marktprämie</dt><dd>'+SW.num(k.erloes_eur,2)+' €</dd></div><div><dt>Kosten Direktvermarkter</dt><dd>'+SW.num(k.kosten_dv_eur,2)+' €'+(k.kosten_dv_ct!=null?' ('+SW.num(k.kosten_dv_ct,2)+' ct/kWh)':'')+'</dd></div><div><dt>Netto nach Kosten</dt><dd><strong>'+SW.num(k.netto_eur,2)+' €</strong></dd></div></dl>';
  var pts=(e.punkte||[]).slice().sort(function(x,y){return STUFE[x.stufe][1]-STUFE[y.stufe][1];});
  h+='<ul class="sw-ck-list">'+pts.map(function(p){return '<li class="'+p.stufe+'"><span aria-hidden="true">'+STUFE[p.stufe][0]+'</span><div><strong>'+E(p.titel)+'</strong><br>'+E(p.text)+'</div></li>';}).join('')+'</ul>';
  var ng=e.negativpreise;
  if(ng&&ng.perioden&&ng.perioden.length)h+='<details class="sw-vmdet"><summary>Betroffene Zeiten mit negativen Preisen ('+ng.perioden.length+')</summary><p class="sw-muted" style="font-size:14px">'+ng.perioden.map(function(x){return E(x.von)+' bis '+E(x.bis);}).join('<br>')+'</p></details>';
  if(ng)h+='<p class="sw-muted" style="font-size:12px;margin:8px 0 0">'+E(ng.quelle)+'</p>';
  return h;
}
function checkSection(a,checks,allDocs){
  var h='<section class="sw-card" id="ck"><h2>Abrechnungs-Check</h2><p class="sw-muted">Laden Sie jeden Monat die Gutschrift Ihres Direktvermarkters und die Abrechnung der Marktprämie vom Netzbetreiber hoch. Wir prüfen Mengen, Marktwert, Marktprämie, Kosten, Umsatzsteuer, Stammdaten und die Regeln bei negativen Preisen.</p>'+
  '<div class="sw-grid"><div><label for="ck_m">Monat</label><input id="ck_m" type="month" value="'+vormonat()+'"></div><div></div>'+
  '<div><label for="ck_dv">Gutschrift Direktvermarkter</label><input id="ck_dv" type="file" accept="application/pdf,image/jpeg,image/png"></div>'+
  '<div><label for="ck_nb">Abrechnung Netzbetreiber (Marktprämie)</label><input id="ck_nb" type="file" accept="application/pdf,image/jpeg,image/png"></div></div>'+
  '<div id="ck_err"></div><div class="sw-row" style="margin-top:14px"><button class="sw-btn" id="ck_go">Hochladen und prüfen</button></div>';
  if(checks.length){
    h+='<div class="sw-ck-months">'+checks.map(function(c,i){var s=CK[c.status]||CK.fehler,m=String(c.monat).slice(0,7);
      var files=allDocs.filter(function(d){return String(d.monat||'').slice(0,7)===m&&String(d.art).indexOf('gutschrift_')===0;});
      return '<details class="sw-ck"'+(i===0?' open':'')+'><summary><span>'+s[0]+'</span><strong>'+monatName(m)+'</strong><span class="sw-badge" style="--c:'+s[2]+'">'+s[1]+'</span></summary>'+checkBody(c.ergebnis)+
      '<p style="font-size:14px;margin:12px 0 0">'+files.map(function(d){return '<a href="#" data-file="'+E(d.pfad)+'">'+E(SW.ART[d.art]||d.art)+'</a>';}).join(' · ')+' · <a href="#" data-recheck="'+m+'">Erneut prüfen</a></p></details>';}).join('')+'</div>';
  } else h+='<p class="sw-muted" style="margin:16px 0 0;font-size:14px">Noch keine Prüfung.</p>';
  return h+'</section>';
}
async function uploadCheck(a,file,art,monat){
  if(file.size>20971520)throw new Error(file.name+' ist größer als 20 MB.');
  var path=a.owner+'/'+a.id+'/'+Date.now()+'_'+SW.safeName(file.name);
  await SW.upload(path,file);
  await SW.rest('dokumente',{method:'POST',body:{anlage_id:a.id,owner:a.owner,art:art,pfad:path,dateiname:file.name,monat:monat+'-01'}});
}
async function runCheck(a,id,monat,btn){
  busy(btn,true,'Wir prüfen … (bis zu einer Minute)');
  var r=await SW.fn('pruefen',{anlage_id:a.id,monat:monat});
  if(!r||!r.ok){busy(btn,false);$('#ck_err').innerHTML=msg('err',(r&&r.error)||'Die Prüfung hat nicht geklappt. Bitte später noch einmal.');return;}
  await SW.rest('verlauf',{method:'POST',body:{anlage_id:a.id,text:'Abrechnungs-Check '+monatName(monat)+': '+(CK[r.status]||CK.fehler)[1]}}).catch(function(){});
  renderAnlage(id);
}
function mountCheck(a,id){
  var go=$('#ck_go');if(!go)return;
  go.onclick=async function(){var b=this,m=$('#ck_m').value,dv=$('#ck_dv').files[0],nb=$('#ck_nb').files[0];$('#ck_err').innerHTML='';
    if(!/^\d{4}-\d{2}$/.test(m)){$('#ck_err').innerHTML=msg('err','Bitte den Monat wählen.');return;}
    if(!dv&&!nb){$('#ck_err').innerHTML=msg('err','Bitte mindestens eine Abrechnung auswählen, am besten beide.');return;}
    busy(b,true,'Wird hochgeladen …');
    try{if(dv)await uploadCheck(a,dv,'gutschrift_dv',m);if(nb)await uploadCheck(a,nb,'gutschrift_nb',m);await runCheck(a,id,m,b);}
    catch(x){$('#ck_err').innerHTML=msg('err',x.message);busy(b,false);}};
  app.querySelectorAll('[data-recheck]').forEach(function(l){l.onclick=async function(e){e.preventDefault();try{await runCheck(a,id,l.dataset.recheck,go);}catch(x){alertBox(x.message);}};});
}

/* ---------- Modal ---------- */
function showModal(inner){modal.innerHTML='<div class="sw-modal" role="dialog" aria-modal="true"><div>'+inner+'</div></div>';modal.querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeModal;});var f=modal.querySelector('input,button');if(f)f.focus();}
function closeModal(){modal.innerHTML='';}
function alertBox(t){showModal('<p>'+E(t)+'</p><button class="sw-btn" data-close>OK</button>');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ---------- Start ---------- */
async function route(){
  var h=location.hash||'#/';
  try{
    if(h==='#/neu')renderNew();
    else if(h.indexOf('#/anlage/')===0)await renderAnlage(h.slice(9));
    else await renderHome();
  }catch(x){app.innerHTML=msg('err','Es ist ein Fehler aufgetreten: '+x.message)+'<p><a href="#/">Neu laden</a></p>';}
  window.scrollTo(0,0);
}
async function start(){
  me=await SW.me(); if(!me){await SW.signOut();renderAuth();return;}
  var p=await SW.rest('profiles?select=*&id=eq.'+me.id); profile=p[0]||null;
  nav.innerHTML=(profile&&profile.rolle==='admin'?'<a class="sw-btn ghost small" href="admin.html">Verwaltung</a>':'')+'<span class="sw-muted" style="font-size:14px">'+E(me.email)+'</span><button class="sw-btn ghost small" id="out">Abmelden</button>';
  document.getElementById('out').onclick=async function(){await SW.signOut();location.hash='';renderAuth();};
  route();
}
window.addEventListener('hashchange',function(){if(me)route();});
(async function(){
  var t=SW.fromHash();
  if(t==='recovery'){renderNewPassword();return;}
  if(!SW.user&&!t){renderAuth();return;}
  try{await start();}catch(e){renderAuth();}
})();
})();
</script>
