var STRIPE_PK='pk_test_51UeyalENDQKfxlzFn1J1SelV2LBDxXE7AoPLeL7XQ568a06OHT5TFKBJvUVG3a53jNX3lwBwQEsIdx87p1pq91va00BULZAc72',_stripe=null,_einbett=null;
var STRIPE_HINWEIS='<p class="sw-muted" style="font-size:13px;margin:10px 0 0">🔒 Die Zahlung wird sicher über unseren Zahlungsdienstleister Stripe abgewickelt. Ihre Kartendaten speichern wir nicht.</p>';
function stripeLaden(){if(_stripe)return Promise.resolve(_stripe);return new Promise(function(ok,nok){var sc=document.createElement('script');sc.src='https://js.stripe.com/v3/';sc.onload=function(){_stripe=window.Stripe(STRIPE_PK,{locale:'de'});ok(_stripe);};sc.onerror=function(){nok(new Error('Die Bezahlmaske konnte nicht geladen werden.'));};document.head.appendChild(sc);});}
async function einbetten(ziel,secret){if(_einbett){try{_einbett.destroy();}catch(x){}_einbett=null;}var st=await stripeLaden();_einbett=await st.initEmbeddedCheckout({fetchClientSecret:function(){return Promise.resolve(secret);}});_einbett.mount(ziel);}
function gruss(){var p=profile||{},n=String(p.name||'').trim();if(p.anrede&&n)return 'Guten Tag, '+p.anrede+' '+n.split(/\s+/).pop();return n?'Guten Tag, '+n:'Guten Tag';}

function go(h){if(location.hash===h)route();else location.hash=h;}

/* ---------- Anmeldung ---------- */
function renderAuth(mode,note){
  nav.innerHTML='';
  mode=mode||'login';
  app.innerHTML='<div style="max-width:460px;margin:0 auto"><h1>Ihr SwitchWatt-Konto</h1>'+
  '<p class="sw-muted">'+(WUNSCH==='check'?'Hier laden Sie jeden Monat Ihre Abrechnungen hoch und sehen sofort, ob alles stimmt.':'Hier laden Sie Ihre Verträge hoch, sehen die Angebote und geben den Wechsel frei.')+'</p>'+
  (note||'')+(mode==='login'&&SW.abgemeldet()?'<div class="sw-msg info" style="font-size:14px">Sie wurden nach 30 Minuten ohne Aktivität automatisch abgemeldet. Bitte melden Sie sich erneut an.</div>':'')+
  (mode==='signup'&&!note&&WUNSCH==='check'?'<div class="sw-msg info" style="font-size:14px"><strong>Exklusive Pilotphase.</strong> Den Abrechnungs-Check buchen Sie pro Anlage, monatlich oder jährlich. Bei Fragen meldet sich ein Mensch persönlich.</div>':'')+
  (mode==='signup'&&!note&&WUNSCH!=='check'?'<div class="sw-msg info" style="font-size:14px"><strong>Exklusive Pilotphase.</strong> Wir nehmen nur eine begrenzte Zahl an Anlagen auf, mit Vorrang nach Kündigungstermin, und melden uns nach Ihrer Anmeldung persönlich. Die Vollmacht erlaubt uns nur, Angebote einzuholen. Gekündigt und gewechselt wird erst, wenn Sie ein Angebot freigeben.</div>':'')+
  '<div class="sw-card"><div class="sw-tabs" role="tablist"><button role="tab" data-m="login" aria-selected="'+(mode==='login')+'">Anmelden</button><button role="tab" data-m="signup" aria-selected="'+(mode==='signup')+'">Konto anlegen</button></div>'+
  '<form id="f" novalidate>'+
  (mode==='signup'?'<div style="margin-bottom:14px"><label for="anrede">Anrede</label><select id="anrede"><option value="">keine Angabe</option><option>Frau</option><option>Herr</option></select></div><div style="margin-bottom:14px"><label for="name">Ihr Vor- und Nachname</label><input id="name" required autocomplete="name"></div><div style="margin-bottom:14px"><label for="firma">Firma (optional)</label><input id="firma" autocomplete="organization"></div><div style="margin-bottom:14px"><label for="tel">Telefon (optional)</label><input id="tel" type="tel" autocomplete="tel"></div>':'')+
  '<div style="margin-bottom:14px"><label for="mail">E-Mail</label><input id="mail" type="email" required autocomplete="email"></div>'+
  '<div style="margin-bottom:14px"><label for="pw">Passwort'+(mode==='signup'?' ('+PW_REGEL+')':'')+'</label><input id="pw" type="password" required autocomplete="'+(mode==='signup'?'new-password':'current-password')+'"></div>'+
  (mode==='signup'?'<label class="sw-check" style="margin-bottom:16px"><input type="checkbox" id="ds" required><span>Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen.</span></label>':'')+
  '<div id="err"></div><button class="sw-btn" style="width:100%" type="submit">'+(mode==='signup'?'Konto anlegen':'Anmelden')+'</button></form>'+
  (mode==='login'?'<p style="margin:16px 0 0;font-size:14px"><a href="#" id="forgot">Passwort vergessen?</a></p>':'')+
  '</div></div>';
  app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){renderAuth(b.dataset.m);};});
  var fg=$('#forgot'); if(fg)fg.onclick=function(e){e.preventDefault();renderForgot();};
  $('#f').onsubmit=async function(e){e.preventDefault();var btn=this.querySelector('button[type=submit]'),err=$('#err');err.innerHTML='';
    var mail=$('#mail').value.trim(),pw=$('#pw').value;
    if(!mail||!pw){err.innerHTML=msg('err','Bitte E-Mail und Passwort eingeben.');return;}
    if(mode==='signup'&&!pwOk(pw)){err.innerHTML=msg('err','Das Passwort braucht '+PW_REGEL+'.');return;}
    busy(btn,true);
    try{
      if(mode==='signup'){
        if(!$('#name').value.trim()){throw new Error('Bitte geben Sie Ihren Namen ein.');}
        if(!$('#ds').checked){throw new Error('Bitte bestätigen Sie die Datenschutzerklärung.');}
        var d=await SW.signUp(mail,pw,{anrede:$('#anrede').value||null,name:$('#name').value.trim(),firma:$('#firma').value.trim(),telefon:$('#tel').value.trim(),bereich:WUNSCH||'wechsel'});
        if(!d||!d.access_token){renderAuth('login',msg('info','Fast geschafft: Bitte bestätigen Sie Ihre E-Mail-Adresse über den Link, den wir Ihnen geschickt haben. Danach können Sie sich anmelden.'));return;}
      } else { await SW.signIn(mail,pw); }
      await start();
    }catch(x){err.innerHTML=msg('err',x.message);busy(btn,false);}
  };
}
function renderForgot(){
  app.innerHTML='<div style="max-width:460px;margin:0 auto"><h1>Passwort zurücksetzen</h1><div class="sw-card"><form id="f"><label for="mail">E-Mail</label><input id="mail" type="email" required autocomplete="email"><div id="err"></div><div class="sw-row" style="margin-top:16px"><button class="sw-btn" type="submit">Link senden</button><button class="sw-btn ghost" type="button" id="back">Zurück</button></div></form></div></div>';
  $('#back').onclick=function(){renderAuth();};
  $('#f').onsubmit=async function(e){e.preventDefault();var btn=this.querySelector('[type=submit]');busy(btn,true);
    try{await SW.recover($('#mail').value.trim(),location.origin+location.pathname);$('#err').innerHTML=msg('ok','Wenn es ein Konto mit dieser E-Mail gibt, ist ein Link unterwegs.');}
    catch(x){$('#err').innerHTML=msg('err',x.message);} busy(btn,false);};
}
function renderNewPassword(){
  app.innerHTML='<div style="max-width:460px;margin:0 auto"><h1>Neues Passwort</h1><div class="sw-card"><form id="f"><label for="pw">Neues Passwort ('+PW_REGEL+')</label><input id="pw" type="password" required autocomplete="new-password"><div id="err"></div><button class="sw-btn" style="margin-top:16px" type="submit">Speichern</button></form></div></div>';
  $('#f').onsubmit=async function(e){e.preventDefault();var pw=$('#pw').value;if(!pwOk(pw)){$('#err').innerHTML=msg('err','Das Passwort braucht '+PW_REGEL+'.');return;}
    try{await SW.setPassword(pw);await start();}catch(x){$('#err').innerHTML=msg('err',x.message);}};
}

/* ---------- Daten ---------- */
async function loadAll(){
  var r=await Promise.all([
    SW.rest('vollmachten?select=*&widerrufen_at=is.null&order=erteilt_at.desc'),
    SW.rest('anlagen?select=*,angebote(id),freigaben(id),pruefungen(monat,status)&order=created_at.asc')
  ]);
  var vms=r[0]||[];
  return {vm:vms[0]||null,vms:vms,anlagen:r[1]};
}
function vmDeckt(vms,aid){return (vms||[]).some(function(v){return v.version===SW.VOLLMACHT_VERSION&&(!v.anlagen||v.anlagen.indexOf(aid)>=0);});}
function steps(vm,anlagen){
  var s=['Konto','Anlage und Vertrag','Vollmacht','Angebote','Freigabe','Kündigung und Wechsel'];
  var best=1; if(anlagen.length)best=2;
  if(vm&&anlagen.length)best=3;
  anlagen.forEach(function(a){var lv={neu:3,in_pruefung:3,angebote:4,freigegeben:5,kuendigung:5,gewechselt:6}[a.status]||3;if(vm&&lv>best)best=lv;});
  return '<ol class="sw-steps">'+s.map(function(t,i){return '<li class="'+(i<best?'done':i===best?'now':'')+'">'+t+'</li>';}).join('')+'</ol>';
}

/* ---------- Übersicht ---------- */
async function renderHome(){
  var d=await loadAll(),vm=d.vm,an=d.anlagen;
  var h='<h1>'+E(gruss())+'</h1><p class="sw-muted">So weit sind Sie:</p>'+steps(an.some(function(x){return vmDeckt(d.vms,x.id);})?vm:null,an);
  h+='<section class="sw-card'+(an.length?'':' hl')+'"><div class="sw-row" style="justify-content:space-between"><h2 style="margin:0">'+(an.length?'Ihre Anlagen':'1. Anlage hinzufügen')+'</h2><a class="sw-btn" href="#/neu">+ Anlage hinzufügen</a></div>';
  if(!an.length)h+='<p class="sw-muted" style="margin-bottom:0">Laden Sie Ihren aktuellen Vertrag oder die letzte Gutschrift hoch, ein Handyfoto reicht. Wir lesen die Daten für Sie aus.</p>';
  an.forEach(function(a){var dd=SW.daysUntil(a.kuendigung_bis);
    h+='<div class="sw-list-item"><div><strong>'+E(a.name)+'</strong> '+SW.badge(a.status)+(!a.daten_bestaetigt_at&&['neu','in_pruefung'].indexOf(a.status)>=0?' <span class="sw-badge" style="--c:#F5B70A">Daten prüfen</span>':'')+'<div class="sw-muted" style="font-size:14px">'+(a.kwp?SW.num(a.kwp,1)+' kWp · ':'')+E(a.direktvermarkter||'Direktvermarkter noch offen')+
    (a.kuendigung_bis?' · Kündigen bis '+SW.date(a.kuendigung_bis)+(dd!=null&&dd<=30&&dd>=0&&['neu','in_pruefung','angebote','freigegeben'].indexOf(a.status)>=0?' <span class="sw-red">(noch '+dd+' Tage)</span>':''):'')+
(SW.arr(a.angebote).length&&!SW.arr(a.freigaben).length?' · <span style="color:#86EFAC">'+SW.arr(a.angebote).length+' Angebot(e)</span>':'')+'</div></div><a class="sw-btn ghost small" href="#/anlage/'+a.id+'">Öffnen</a></div>';});
  h+='</section>';
  var vms=d.vms||[],offenA=an.filter(function(x){return !vmDeckt(vms,x.id);}),gedeckt=an.filter(function(x){return vmDeckt(vms,x.id);});
  var vmAlt=vms.some(function(v){return v.version!==SW.VOLLMACHT_VERSION;});
  if(offenA.length){
    h+='<section class="sw-card hl"><h2>'+(gedeckt.length?'Vollmacht für weitere Anlagen':'2. Vollmacht erteilen')+'</h2>'+(vmAlt&&!gedeckt.length?'<p>Wir haben die Vollmacht überarbeitet: Kündigung und neuen Vertrag unterschreiben Sie immer selbst, wir bereiten nur vor und übermitteln. Bitte erteilen Sie die neue Fassung.</p>':'')+
    '<ul class="sw-vmkurz"><li><strong>Sie erlauben uns:</strong> Angebote bei Direktvermarktern einzuholen und dafür Ihre Anlagendaten weiterzugeben, und die Einspeisedaten beim Netzbetreiber anzufordern.</li><li><strong>Erst wenn Sie ein Angebot freigeben,</strong> bereiten wir Kündigung und neuen Vertrag vor. Unterschreiben tun Sie selbst, wir übermitteln die Unterlagen.</li><li><strong>Widerruf</strong> jederzeit hier im Kundenkonto oder per E-Mail an angebote@switchwatt.de.</li></ul>'+
    '<details class="sw-vmdet"><summary>Vollständigen Text der Vollmacht lesen</summary><div class="sw-vm">'+SW.VOLLMACHT_HTML+'</div></details>'+
    '<form id="vmf" style="margin-top:16px"><label>Für welche Anlagen?</label>'+
    (offenA.length>1?'<label class="sw-check" style="margin:6px 0 4px"><input type="checkbox" id="vmall"><span><strong>Alle auswählen</strong></span></label>':'')+
    offenA.map(function(x){return '<label class="sw-check" style="margin:4px 0"><input type="checkbox" class="vma" value="'+x.id+'"'+(offenA.length===1?' checked':'')+'><span>'+E(x.name)+(x.kwp?' <span class="sw-muted">('+SW.num(x.kwp,1)+' kWp)</span>':'')+'</span></label>';}).join('')+
    '<div class="sw-grid" style="margin-top:12px"><div><label for="vmn">Ihr Name</label><input id="vmn" required value="'+E(profile&&profile.name||'')+'"></div><div><label for="vmfi">Für die Firma (Betreiber)</label><input id="vmfi" value="'+E(profile&&profile.firma||'')+'"></div></div>'+
    '<div id="vmreg" aria-live="polite"></div>'+'<label class="sw-check" style="margin:16px 0 10px"><input type="checkbox" id="vmc"><span>Ich erteile die Vollmacht wie oben beschrieben für die ausgewählten Anlagen und bin allein vertretungsberechtigt oder handle mit Zustimmung aller Vertretungsberechtigten (bei einer GbR in der Regel alle Gesellschafter).</span></label>'+'<label class="sw-check" style="margin:0 0 16px"><input type="checkbox" id="vmagb"><span>Ich habe die <a href="agb.html" target="_blank">AGB</a> (Stand '+SW.AGB_VERSION+') gelesen und akzeptiere sie.</span></label>'+'<p class="sw-muted" style="font-size:14px;margin:0 0 14px">Mit der Vollmacht beauftragen Sie uns, Angebote einzuholen. Finden wir kein besseres Angebot, kostet das nichts.</p><div id="vmerr"></div><button class="sw-btn" type="submit">Vollmacht und Auftrag erteilen</button></form></section>';
  }
  if(gedeckt.length){
    h+='<p class="sw-msg ok">Vollmacht erteilt für '+gedeckt.map(function(x){return E(x.name);}).join(', ')+'. <a href="#" id="vmshow">Text ansehen</a> · <a href="#" id="vmwid">Widerrufen</a></p>';
  }
  h+='<p class="sw-muted" style="font-size:14px">Fragen? Schreiben Sie uns: <a href="mailto:angebote@switchwatt.de">angebote@switchwatt.de</a> oder über das <a href="impressum.html#kontakt" target="_blank">Kontaktformular</a></p>';
  app.innerHTML=h;
  var vs=$('#vmshow'); if(vs)vs.onclick=function(e){e.preventDefault();var akt=vms.filter(function(v){return v.version===SW.VOLLMACHT_VERSION;});
    showModal('<h2>Ihre Vollmacht</h2><div class="sw-vm">'+SW.VOLLMACHT_HTML+'</div><p style="font-size:14px">'+akt.map(function(v){var na=v.anlagen?an.filter(function(x){return v.anlagen.indexOf(x.id)>=0;}).map(function(x){return x.name;}):an.map(function(x){return x.name;});return 'Erteilt am '+SW.dateTime(v.erteilt_at)+' von '+E(v.name_unterzeichner)+(v.firma?' für '+E(v.firma):'')+' für: <strong>'+E(na.join(', '))+'</strong>';}).join('<br>')+'</p><p class="sw-muted" style="font-size:14px">'+E(SW.vmFassung(SW.VOLLMACHT_VERSION))+'. Widerruf jederzeit hier im Kundenkonto oder per E-Mail an angebote@switchwatt.de.</p><button class="sw-btn" data-close>Schließen</button>');};
  var vw=$('#vmwid'); if(vw)vw.onclick=async function(e){e.preventDefault();if(!confirm('Vollmacht wirklich widerrufen? Wir holen dann keine Angebote mehr für diese Anlagen ein.'))return;try{for(var i=0;i<vms.length;i++)await SW.rest('rpc/vollmacht_widerrufen',{method:'POST',body:{vid:vms[i].id}});for(var j=0;j<gedeckt.length;j++)await SW.rest('verlauf',{method:'POST',body:{anlage_id:gedeckt[j].id,text:'Vollmacht widerrufen'}}).catch(function(){});renderHome();}catch(x){alertBox(x.message);}};
  var regT=null,regLetzt='';async function regPruef(){var fi=$('#vmfi'),na=$('#vmn'),box=$('#vmreg');if(!fi||!na||!box)return;var f=fi.value.trim(),n=na.value.trim(),k=f+'|'+n;if(k===regLetzt)return;regLetzt=k;box.innerHTML='';if(f.length<3||n.length<3||!/(gmbh|\bkg\b|gbr|\bug\b|\bag\b|\beg\b|ohg|partg|mbh)/i.test(f))return;
    try{var r=await SW.fn('register',{firma:f,name:n});if(k!==regLetzt||!r||!r.verfuegbar)return;
      var lst=(r.vertreter||[]).map(function(v){return E(v.name)+(v.art?' ('+E(v.art)+')':'')+(v.ueber?' <span class="sw-muted">über '+E(v.ueber)+'</span>':'');}).join(', ');
      var reg=E(r.register_name)+' <span class="sw-muted">('+E(r.register)+')</span>';
      var t={allein:['ok','Abgleich mit dem Register: Sie sind für '+reg+' allein vertretungsberechtigt.'],
        gemeinsam:['info','⚠️ Laut Register vertreten Sie '+reg+' nur gemeinsam mit anderen. Bitte holen Sie vorher die Zustimmung der übrigen Vertretungsberechtigten ein. Eingetragen: '+lst+'.'],
        ausgeschlossen:['info','⚠️ Laut Register sind Sie bei '+reg+' von der Vertretung ausgeschlossen. Vertretungsberechtigt: '+lst+'. Bitte lassen Sie die Vollmacht von einer dieser Personen erteilen oder holen Sie deren Zustimmung ein.'],
        nicht_eingetragen:['info','⚠️ Ihr Name steht bei '+reg+' nicht als Vertreter im Register. Eingetragen: '+lst+'. Wenn Sie anders berechtigt sind, zum Beispiel mit einer Vollmacht, können Sie trotzdem fortfahren.']}[r.status];
      if(t)box.innerHTML='<p class="sw-msg '+t[0]+'" style="font-size:14px;margin:12px 0 0">'+t[1]+'</p>';}catch(x){}}
  ['#vmfi','#vmn'].forEach(function(sel){var el=$(sel);if(el)el.addEventListener('change',regPruef);});
  regPruef();
  var all=$('#vmall'); if(all)all.onchange=function(){app.querySelectorAll('.vma').forEach(function(c){c.checked=all.checked;});};
  app.querySelectorAll('.vma').forEach(function(c){c.onchange=function(){if(all){var cs=app.querySelectorAll('.vma');all.checked=Array.prototype.every.call(cs,function(x){return x.checked;});}};});
  var f=$('#vmf'); if(f)f.onsubmit=async function(e){e.preventDefault();var btn=f.querySelector('[type=submit]'),n=$('#vmn').value.trim(),ids=Array.prototype.filter.call(app.querySelectorAll('.vma'),function(c){return c.checked;}).map(function(c){return c.value;});

var HAFTUNG='Automatische Plausibilitätsprüfung auf Grundlage Ihrer Unterlagen und öffentlicher Daten. Schätzungen sind als solche gekennzeichnet. Keine Rechts- oder Steuerberatung, ohne Gewähr.';

/* Anfragetexte: eigene Formulierung je Thema, geschrieben vom Anlagenbetreiber an die jeweilige Stelle.

function anfrageKern(e,p,w){
  var m=monatName(e.monat),t=p.titel,v=p.werte||{},wer=w==='dv'?'Ihrer Abrechnung':'Ihrer Gutschrift';
  if(/^Umsatzsteuer|^Negative Preise/.test(t))return null;

  if(/^Betreibername/.test(t))return v[w]&&v.eigen?'bitte aktualisieren Sie den Namen des Anlagenbetreibers. Bei Ihnen ist hinterlegt: „'+v[w]+'“. Richtig ist: „'+v.eigen+'“.':null;

  if(/^Marktwert weicht ab/.test(t))return 'der in '+wer+' für '+m+' angesetzte Marktwert entspricht nicht dem veröffentlichten Marktwert Solar. Bitte prüfen Sie das und senden Sie uns gegebenenfalls eine Korrektur.';
  if(/^Vermarktungsentgelt höher/.test(t))return v.istEur?'in Ihrer Abrechnung für '+m+' ist ein Vermarktungsentgelt von '+v.istEur+' angesetzt. Das sind '+v.ist+' % der Vergütung von '+v.erl+'. Vereinbart sind '+v.soll+' %'+(v.ev?' bei 0 % Eigenverbrauch':'')+', also '+v.sollEur+'.'+(v.ev?' Unsere Anlage hat keinen Eigenverbrauch. Bitte teilen Sie uns mit, welchen Eigenverbrauchsanteil und welche Erzeugungswerte Sie angesetzt haben, und prüfen Sie, ob die Daten unseres Datenloggers vollständig bei Ihnen ankommen.':'')+' Bitte korrigieren Sie die Abrechnung um '+v.diff+'.':null;
  if(/^Pauschale höher/.test(t))return 'in Ihrer Abrechnung für '+m+' ist eine höhere Vermarktungspauschale angesetzt, als in unserem Vertrag vereinbart ist. Bitte prüfen Sie das und korrigieren Sie die Abrechnung gegebenenfalls.';

  if(/^Marktprämie/.test(t))return 'die Marktprämie in Ihrer Gutschrift für '+m+' können wir nicht nachvollziehen. Bitte erläutern Sie uns die Berechnung.';
  if(/^Einspeisemengen/.test(t))return 'die Einspeisemenge in '+wer+' für '+m+' weicht von der Menge '+(w==='dv'?'des Netzbetreibers':'des Direktvermarkters')+' ab. Bitte prüfen Sie, welche Menge gilt.';
  if(/^Einspeisung deutlich unter/.test(t))return 'die abgerechnete Einspeisemenge für '+m+' liegt deutlich unter der Erzeugung, die unser Monitoring für diesen Monat zeigt. Bitte prüfen Sie die Zählerwerte und teilen Sie uns die abgelesenen Stände mit.';

  SW.fn('stripe',{aktion:'zahlung_info'}).then(function(z){if(!z||!z.ok)throw new Error((z&&z.error)||'');

    $('#k_kneu').onclick=async function(){var b=this;busy(b,true);try{var r=await SW.fn('stripe',{aktion:'karte_neu'});if(!r||!r.ok)throw new Error((r&&r.error)||'Nicht möglich.');b.remove();$('#k_kartebox').innerHTML='<p class="sw-muted" style="font-size:14px;margin:12px 0 0">Mit der Hinterlegung ermächtigen Sie SwitchWatt, die Karte für fällige Abo-Entgelte und Vergütungen nach den <a href="agb.html" target="_blank">AGB</a> zu belasten. Vor jeder Belastung erhalten Sie eine Rechnung.</p><div id="k_pay" class="sw-pay" style="margin-top:12px"></div>'+STRIPE_HINWEIS;await einbetten('#k_pay',r.client_secret);}catch(x){alertBox(x.message);busy(b,false);}};
    var rs=z.rechnungen||[];$('#k_rech').innerHTML=rs.length?'<table class="sw-stack"><thead><tr><th>Datum</th><th>Nummer</th><th>Betrag</th><th>Status</th><th></th></tr></thead><tbody>'+rs.map(function(x){return '<tr><td data-l="Datum">'+SW.date(new Date(x.datum*1000).toISOString())+'</td><td data-l="Nummer">'+E(x.nummer||'–')+'</td><td data-l="Betrag">'+SW.num(x.betrag/100,2)+' €</td><td data-l="Status">'+({paid:'bezahlt',open:'offen',void:'storniert',uncollectible:'uneinbringlich'}[x.status]||E(x.status))+'</td><td data-l="">'+(x.pdf?'<a href="'+E(x.pdf)+'" target="_blank" rel="noopener">PDF herunterladen</a>':'')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="sw-muted" style="margin:0">Noch keine Rechnungen.</p>';
  }).catch(function(){$('#k_karte').innerHTML=msg('err','Zahlungsdaten konnten gerade nicht geladen werden.');$('#k_rech').innerHTML='';});
  $('#k_pwsave').onclick=async function(){var pw=$('#k_pw').value;if(!pwOk(pw)){$('#k_pwmsg').innerHTML=msg('err','Das Passwort braucht '+PW_REGEL+'.');return;}
    busy(this,true);try{await SW.setPassword(pw);$('#k_pw').value='';$('#k_pwmsg').innerHTML=msg('ok','Passwort geändert.');}catch(x){$('#k_pwmsg').innerHTML=msg('err',x.message);}busy(this,false);};
}
async function start(){
  me=await SW.me(); if(!me){await SW.signOut();renderAuth();return;}
  var p=await SW.rest('profiles?select=*&id=eq.'+me.id); profile=p[0]||null;
  if(profile&&profile.rolle==='admin'){location.replace('admin.html');return;}
  nav.innerHTML=(profile&&profile.rolle==='admin'?'<a class="sw-btn ghost small" href="admin.html">Verwaltung</a>':'')+'<span class="sw-muted sw-hide-s" style="font-size:14px">'+E(me.email)+'</span><a class="sw-btn ghost small" href="#/konto">Kundenkonto</a><button class="sw-btn ghost small" id="out">Abmelden</button>';
  document.getElementById('out').onclick=async function(){me=null;profile=null;try{await SW.signOut();}catch(x){}var lg=document.querySelector('.sw-logo');if(lg)lg.setAttribute('href','index.html');history.replaceState(null,'',location.pathname);nav.innerHTML='';var b=document.getElementById('bereich');if(b)b.remove();renderAuth();};
  var lg=document.querySelector('.sw-logo');if(lg){lg.setAttribute('href',nurCheck()?'#/check':'#/');lg.setAttribute('title','Zu Ihrer Übersicht');}
  if(WUNSCH==='check'&&(!location.hash||location.hash==='#/')){location.hash='#/check';return;}
  route();
}
window.addEventListener('hashchange',function(){if(me)route();});
(async function(){
  var t=SW.fromHash();
  if(t==='recovery'){renderNewPassword();return;}
  if(!SW.user&&!t){renderAuth();return;}
  try{await start();}catch(e){renderAuth();}
})();
})();
</script>
